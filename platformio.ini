; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev_sim

; ============================================================================
; Simulation Environment - API Testing with Fast Response
; ============================================================================
; This environment is for testing, demonstrations, and development.
; - Light sleep: DISABLED (fast response for demos)
; - Data source: Cloud API (simulated inverter)
; - Upload interval: 20 seconds (fast iteration)
; ============================================================================
[env:esp32dev_sim]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM17
build_flags = 
	-DSIMULATE=1
	-fexceptions
	-DAPI_READ_URL="\"http://20.15.114.131:8080/api/inverter/read\""
	-DAPI_WRITE_URL="\"http://20.15.114.131:8080/api/inverter/write\""
	-DAPI_UPLOAD_URL="\"http://192.168.245.168:5000/api/inverter/upload\""
	-DAUTH_HEADER="\"NjhhZWIwNDU1ZDdmMzg3MzNiMTQ5YjhmOjY4YWViMDQ1NWQ3ZjM4NzMzYjE0OWI4NQ==\""
	-DWRITE_EMULATION_URL="\"http://20.15.114.131:8080/api/inverter/error\""
build_unflags = 
	-fno-exceptions
lib_deps = 
	PubSubClient
	WiFi
	HTTPClient
	bblanchon/ArduinoJson @ ^6.21.3
	LittleFS
	lorol/LittleFS_esp32@^1.0.6

; ============================================================================
; Real Hardware Environment - RS-485 with Auto Light Sleep
; ============================================================================
; This environment is for production deployment with physical inverters.
; - Light sleep: ENABLED 
; - Data source: Physical inverter via RS-485 Modbus RTU
; - Upload interval: 15 minutes (900000 ms)
; - Power management: ESP-IDF PM + FreeRTOS Tickless IDLE
; 
; Power Management Configuration:
; - CONFIG_PM_ENABLE: Enable Power Management component
; - CONFIG_FREERTOS_USE_TICKLESS_IDLE: Enable FreeRTOS tickless mode
; - CONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP: Min 3 ticks (30ms) before sleep
; - CONFIG_ESP32_RTC_CLK_SRC_EXT_CRYS: External 32kHz crystal for accuracy
; - CONFIG_ESP32_XTAL_FREQ_AUTO: Auto-detect main crystal frequency
; 
; Hardware Requirements:
; - ESP32 DevKit V1 with external 32.768kHz crystal on GPIO32/33
; - RS-485 transceiver connected to Serial2 (TX=17, RX=16, DE/RE=21)
; - Stable WiFi connection for cloud uploads
; ============================================================================
[env:esp32dev_hw]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM17
build_flags = 
	-DSIMULATE=0
	-fexceptions
	-DCONFIG_PM_ENABLE=1
	-DCONFIG_FREERTOS_USE_TICKLESS_IDLE=1
	-DCONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=3
	-DCONFIG_ESP32_RTC_CLK_SRC_EXT_CRYS=1
	-DCONFIG_ESP32_RTC_CLK_CAL_CYCLES=1024
	-DCONFIG_ESP32_XTAL_FREQ_AUTO=1
	-DAPI_UPLOAD_URL="\"http://192.168.245.168:5000/api/inverter/upload\""
	-DAUTH_HEADER="\"NjhhZWIwNDU1ZDdmMzg3MzNiMTQ5YjhmOjY4YWViMDQ1NWQ3ZjM4NzMzYjE0OWI4NQ==\""
build_unflags = 
	-fno-exceptions
lib_deps = 
	PubSubClient
	WiFi
	HTTPClient
	bblanchon/ArduinoJson @ ^6.21.3
	LittleFS
	lorol/LittleFS_esp32@^1.0.6
